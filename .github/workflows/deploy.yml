name: Build and deploy

# Builds the container on GitHub Actions. On main it pushes the image to Artifact Registry and
# deploys it to Cloud Run (service mawa-frontend); release tags push a versioned image.
# Pull requests only build. See https://github.com/mawadao/.github/tree/main/.github/workflows

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  cloud-run:
    uses: mawadao/.github/.github/workflows/cloud-run.yml@main
    with:
      image: mawa-frontend
      service: mawa-frontend
      public: true
      flags: --max-instances=3
